<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#312e81" stroke-width="6" />

  <!-- Radar / HUD Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#3730a3" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#4338ca" stroke-width="2" opacity="0.4"/>

  <!-- Rocket Flame Glow -->
  <ellipse cx="256" cy="380" rx="36" ry="60" fill="url(#flameGrad)" filter="url(#glow)" opacity="0.85"/>
  <ellipse cx="256" cy="365" rx="18" ry="35" fill="#fef08a" />

  <!-- Rocket Body -->
  <path d="M256 80 C290 150 320 230 310 320 L202 320 C192 230 222 150 256 80 Z" fill="url(#rocketGrad)" />

  <!-- Left Fin -->
  <path d="M205 270 L140 330 C135 345 150 355 170 350 L205 320 Z" fill="#4338ca" />

  <!-- Right Fin -->
  <path d="M307 270 L372 330 C377 345 362 355 342 350 L307 320 Z" fill="#4338ca" />

  <!-- Porthole Window -->
  <circle cx="256" cy="190" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
  <circle cx="256" cy="190" r="22" fill="#0284c7" opacity="0.8"/>
  <circle cx="248" cy="182" r="7" fill="#ffffff" opacity="0.9"/>
</svg>
